# Uno family. nuget.org uses NUGET_KEY_UNO (Plugin.Uno.*). GitHub Packages uses GITHUB_TOKEN.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  version-align:
    name: Version alignment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Require matching packable package versions
        run: |
          set -euo pipefail
          python3 .github/scripts/check-versions.py --plugin-root . --scope library

  version-check:
    name: NuGet release
    needs: [version-align]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nuvyntralabs/MauiEssentials
          ref: main
          path: .ci-tools
      - name: Check NUGET_KEY_UNO and published version
        env:
          NUGET_KEY: ${{ secrets.NUGET_KEY_UNO }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_KEY}" ]; then
            echo "::warning::NUGET_KEY_UNO is not set yet. Tests and pack still run; nuget.org publish is skipped until the secret exists."
            exit 0
          fi
          python3 .ci-tools/.github/scripts/check-nuget-release.py --plugin-root .

  test:
    name: Unit tests
    needs: [version-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install Uno.Sdk
        run: dotnet new install Uno.Sdk::6.6.42

      - run: dotnet test tests/Plugin.Uno.MVVMExpress.Core.Tests/Plugin.Uno.MVVMExpress.Core.Tests.csproj -c Release --nologo
      - run: dotnet test tests/Plugin.Uno.MVVMExpress.Validation.Tests/Plugin.Uno.MVVMExpress.Validation.Tests.csproj -c Release --nologo
      - run: dotnet test tests/Plugin.Uno.MVVMExpress.Pagination.Tests/Plugin.Uno.MVVMExpress.Pagination.Tests.csproj -c Release --nologo
      - run: dotnet test tests/Plugin.Uno.MVVMExpress.Templates.Tests/Plugin.Uno.MVVMExpress.Templates.Tests.csproj -c Release --nologo
      - run: dotnet test tests/Plugin.Uno.MVVMExpress.Host.Tests/Plugin.Uno.MVVMExpress.Host.Tests.csproj -c Release --nologo
      - run: dotnet test tests/Plugin.Uno.MVVMExpress.Navigation.Tests/Plugin.Uno.MVVMExpress.Navigation.Tests.csproj -c Release --nologo
      - run: dotnet test tests/Plugin.Uno.MVVMExpress.Dialogs.Tests/Plugin.Uno.MVVMExpress.Dialogs.Tests.csproj -c Release --nologo

  linux:
    name: Pack linux
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install Uno.Sdk
        run: dotnet new install Uno.Sdk::6.6.42

      - run: |
          dotnet pack src/Plugin.Uno.MVVMExpress.Core/Plugin.Uno.MVVMExpress.Core.csproj -c Release -o artifacts
          dotnet pack src/Plugin.Uno.MVVMExpress.Validation/Plugin.Uno.MVVMExpress.Validation.csproj -c Release -o artifacts
          dotnet pack src/Plugin.Uno.MVVMExpress.Pagination/Plugin.Uno.MVVMExpress.Pagination.csproj -c Release -o artifacts
          dotnet pack src/Plugin.Uno.MVVMExpress.Testing/Plugin.Uno.MVVMExpress.Testing.csproj -c Release -o artifacts
          dotnet pack src/Plugin.Uno.MVVMExpress.Templates/Plugin.Uno.MVVMExpress.Templates.csproj -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-linux
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  windows:
    name: Pack windows
    needs: [test]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test tests/Plugin.Uno.MVVMExpress.Navigation.Tests/Plugin.Uno.MVVMExpress.Navigation.Tests.csproj -c Release --nologo
      - run: dotnet test tests/Plugin.Uno.MVVMExpress.Dialogs.Tests/Plugin.Uno.MVVMExpress.Dialogs.Tests.csproj -c Release --nologo
      - run: |
          dotnet pack src/Plugin.Uno.MVVMExpress/Plugin.Uno.MVVMExpress.csproj -c Release -o artifacts
          dotnet pack src/Plugin.Uno.MVVMExpress.Navigation/Plugin.Uno.MVVMExpress.Navigation.csproj -c Release -o artifacts
          dotnet pack src/Plugin.Uno.MVVMExpress.Dialogs/Plugin.Uno.MVVMExpress.Dialogs.csproj -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-windows
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  publish:
    name: nuget.org and GitHub Packages
    needs: [linux, windows]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nuvyntralabs/MauiEssentials
          ref: main
          path: .ci-tools
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: nuget-linux
          path: packages
      - uses: actions/download-artifact@v4
        with:
          name: nuget-windows
          path: packages
      - name: Push nupkg
        env:
          NUGET_KEY: ${{ secrets.NUGET_KEY_UNO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_KEY}" ]; then
            echo "::warning::NUGET_KEY_UNO is not set yet. Tests and pack still run; nuget.org publish is skipped until the secret exists."
            exit 0
          fi
          python3 .ci-tools/.github/scripts/push-nuget-packages.py --packages-dir packages
